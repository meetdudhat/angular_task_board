<div
  class="task-card"
  [class]="priorityClass"
  @cardSlideIn
  (click)="edit.emit(task)"
  role="button"
  [attr.aria-label]="'Edit task: ' + task.title"
  tabindex="0"
  (keydown.enter)="edit.emit(task)"
>
  <!-- Priority indicator bar on the left edge -->
  <div class="priority-bar"></div>

  <div class="card-body">
    <div class="card-top">
      <p class="card-title">{{ task.title }}</p>
      <button
        class="btn-delete"
        (click)="onDelete($event)"
        aria-label="Delete task"
        title="Delete"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
        </svg>
      </button>
    </div>

    <p class="card-description" *ngIf="task.description">{{ task.description }}</p>

    <!-- Tags -->
    <div class="card-tags" *ngIf="task.tags.length > 0">
      <span class="tag" *ngFor="let tag of task.tags">{{ tag }}</span>
    </div>

    <!-- Footer: due date -->
    <div class="card-footer" *ngIf="task.dueDate">
      <span class="due-date" [class.overdue]="isOverdue">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        {{ formattedDueDate }}
        <span *ngIf="isOverdue"> · Overdue</span>
      </span>
    </div>
  </div>
</div>
